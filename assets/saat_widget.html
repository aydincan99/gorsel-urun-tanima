<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <style>
    /* Küçük HTML parçası — tarayıcıda çalışır (Streamlit iframe içinde). Ayrı dosya: teslim için. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 6px 10px;
      font-family: "Consolas", "Segoe UI", monospace;
      font-size: 12px;
      color: #334155;
      background: #f1f5f9;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    #etiket { color: #64748b; margin-right: 6px; }
    #zaman { font-weight: 600; color: #1e40af; }
  </style>
</head>
<body>
  <span id="etiket">Yerel saat:</span><span id="zaman">--:--:--</span>
  <script>
    (function () {
      var el = document.getElementById("zaman");
      function guncelle() {
        el.textContent = new Date().toLocaleString("tr-TR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }
      guncelle();
      setInterval(guncelle, 1000);
    })();
  </script>
</body>
</html>
